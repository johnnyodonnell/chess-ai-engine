[package]
name = "selfplay_reinforce"
version = "0.1.0"
edition = "2021"
description = "Search-free REINFORCE self-play worker (tch forward) for chess-ai-engine"

[lib]
name = "selfplay_reinforce"
path = "src/lib.rs"

[[bin]]
name = "selfplay_reinforce"
path = "src/main.rs"

[[bin]]
name = "evaluate_reinforce"
path = "src/bin/evaluate_reinforce.rs"

[dependencies]
# Reuse the chess rules / AlphaZero encoding / move-indexing crate from the
# AlphaZero training tree (one source of truth for board <-> tensor parity).
chess_core = { path = "../../training/chess_core" }
tch = "0.23"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
