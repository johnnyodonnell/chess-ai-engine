[package]
name = "chess_rs"
version = "0.1.0"
edition = "2021"
description = "Native chess board + AlphaZero encoding for self-play (PyO3 extension)"

[lib]
name = "chess_rs"
crate-type = ["cdylib"]

[dependencies]
chess_core = { path = "../chess_core" }
pyo3 = { version = "0.24", features = ["extension-module"] }
numpy = "0.24"
rand = "0.8"
half = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
