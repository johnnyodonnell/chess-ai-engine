[package]
name = "selfplay_rs"
version = "0.1.0"
edition = "2021"
description = "100% Rust self-play worker (tch-rs forward) for chess-ai-engine"

[[bin]]
name = "selfplay_rs"
path = "src/main.rs"

[dependencies]
chess_core = { path = "../chess_core" }
tch = "0.23"
half = "2"
rand = "0.8"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
